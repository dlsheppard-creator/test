<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #000;
        }

        .gradient-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,
                #667eea 0%,
                #764ba2 25%,
                #f093fb 50%,
                #4facfe 75%,
                #667eea 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            filter: blur(100px);
            opacity: 0.8;
        }

        .gradient-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%,
                rgba(120, 119, 198, 0.3),
                transparent 50%),
                radial-gradient(circle at 80% 80%,
                rgba(255, 119, 198, 0.3),
                transparent 50%),
                radial-gradient(circle at 40% 80%,
                rgba(79, 172, 254, 0.3),
                transparent 50%);
            animation: overlayShift 20s ease infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes overlayShift {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }
            50% {
                transform: translate(20px, 20px) rotate(5deg);
            }
            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: white;
            padding: 2rem;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 50%, #e0e0e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: float 6s ease-in-out infinite;
        }

        .subtitle {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            opacity: 0.9;
            margin-bottom: 3rem;
            animation: fadeIn 2s ease-out;
        }

        .notify-form {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            animation: fadeIn 2.5s ease-out;
        }

        .email-input {
            padding: 1rem 1.5rem;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            min-width: 280px;
        }

        .email-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .email-input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .notify-button {
            padding: 1rem 2.5rem;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.85));
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .notify-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.3);
            background: linear-gradient(135deg, #ffffff, #f5f5f5);
        }

        .notify-button:active {
            transform: translateY(0);
        }

        .notify-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 1.5rem;
            font-size: 1rem;
            padding: 1rem 2rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .message.show {
            opacity: 1;
        }

        .message.success {
            border-color: rgba(52, 211, 153, 0.6);
            background: rgba(52, 211, 153, 0.1);
        }

        .message.error {
            border-color: rgba(248, 113, 113, 0.6);
            background: rgba(248, 113, 113, 0.1);
        }

        .floating-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.6;
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            bottom: 10%;
            right: 10%;
            animation-delay: 2s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 4s;
        }

        @media (max-width: 768px) {
            .email-input {
                min-width: 100%;
            }

            .notify-button {
                width: 100%;
            }

            .floating-orb {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="gradient-background"></div>
    <div class="gradient-overlay"></div>

    <div class="floating-orb orb-1"></div>
    <div class="floating-orb orb-2"></div>
    <div class="floating-orb orb-3"></div>

    <div class="content">
        <h1>Coming Soon</h1>
        <p class="subtitle">Something extraordinary is on the way</p>

        <form id="notify-form" class="notify-form">
            <input type="email" id="user-email" class="email-input" placeholder="Enter your email" required>
            <button type="submit" id="submit-btn" class="notify-button">Notify Me</button>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script type="text/javascript">
        // Initialize EmailJS with your public key
        emailjs.init('1WxNbWtT0whO8XBsq');

        const form = document.getElementById('notify-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');
        const emailInput = document.getElementById('user-email');

        form.addEventListener('submit', function(event) {
            event.preventDefault();

            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            messageDiv.className = 'message';
            messageDiv.textContent = '';

            // Prepare email parameters
            const templateParams = {
                to_name: 'Team',
                from_name: emailInput.value,
                user_email: emailInput.value,
                message: 'New signup from sheppard-cooper.com coming soon page!'
            };

            // Send email using EmailJS
            emailjs.send('service_0np3s0s', 'template_cwo5qjp', templateParams)
                .then(function(response) {
                    console.log('SUCCESS!', response.status, response.text);

                    // Show success message
                    messageDiv.textContent = '✓ Thank you! We\'ll notify you when we launch.';
                    messageDiv.className = 'message success show';

                    // Reset form
                    form.reset();

                    // Hide message after 5 seconds
                    setTimeout(() => {
                        messageDiv.className = 'message success';
                    }, 5000);

                }, function(error) {
                    console.error('EmailJS Error:', error);
                    console.error('Error details:', JSON.stringify(error));

                    // Show error message
                    let errorMsg = '✗ Oops! Something went wrong. Please try again.';
                    if (error.text) {
                        console.error('Error text:', error.text);
                        errorMsg = '✗ ' + error.text;
                    }
                    messageDiv.textContent = errorMsg;
                    messageDiv.className = 'message error show';

                    // Hide message after 5 seconds
                    setTimeout(() => {
                        messageDiv.className = 'message error';
                    }, 5000);
                })
                .finally(function() {
                    // Re-enable button
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Notify Me';
                });
        });
    </script>
</body>
</html>
